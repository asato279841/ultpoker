<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アルティメットポーカー記録</title>
<style>
  :root {
    --bg: #0f1420;
    --card: #1a2233;
    --card-border: #2a3550;
    --accent: #d4af37;
    --accent-dim: #8a7226;
    --text: #eef1f7;
    --text-dim: #9aa5bb;
    --win: #3ba55d;
    --lose: #e05252;
    --push: #7a8ba3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
    padding-bottom: 60px;
  }
  h1 {
    font-size: 1.3rem;
    margin: 4px 0 4px;
    text-align: center;
    color: var(--accent);
    letter-spacing: 0.5px;
  }
  .subtitle {
    text-align: center;
    font-size: 0.72rem;
    color: var(--text-dim);
    margin-bottom: 16px;
  }
  .summary {
    display: flex;
    justify-content: space-around;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 16px;
    font-size: 0.85rem;
  }
  .summary div { text-align: center; }
  .summary .num { font-size: 1.2rem; font-weight: bold; display: block; }
  .win-color { color: var(--win); }
  .lose-color { color: var(--lose); }
  .accent-color { color: var(--accent); }

  form {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .field { margin-bottom: 14px; }
  label {
    display: block;
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .field-error {
    font-size: 0.75rem;
    color: var(--lose);
    margin-top: 6px;
    display: none;
  }
  .field-error.show { display: block; }
  .btn-group {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .btn-group button {
    flex: 1;
    min-width: 60px;
    padding: 10px 6px;
    border-radius: 8px;
    border: 1px solid var(--card-border);
    background: #222b40;
    color: var(--text);
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-group button.active {
    background: var(--accent);
    color: #16202f;
    border-color: var(--accent);
  }
  .btn-group.win-lose button[data-val="win"].active {
    background: var(--win); border-color: var(--win); color: #fff;
  }
  .btn-group.win-lose button[data-val="lose"].active {
    background: var(--lose); border-color: var(--lose); color: #fff;
  }
  .btn-group.win-lose button[data-val="push"].active {
    background: var(--push); border-color: var(--push); color: #fff;
  }
  select {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--card-border);
    background: #222b40;
    color: var(--text);
    font-size: 0.95rem;
  }
  textarea {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--card-border);
    background: #222b40;
    color: var(--text);
    font-size: 0.9rem;
    resize: vertical;
    min-height: 40px;
    font-family: inherit;
  }
  .submit-btn {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    color: #16202f;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 4px;
  }
  .cancel-btn {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--card-border);
    background: transparent;
    color: var(--text-dim);
    font-size: 0.9rem;
    margin-top: 8px;
    cursor: pointer;
  }

  .entry-list h2 {
    font-size: 1rem;
    color: var(--text-dim);
    margin: 0 0 10px 2px;
    font-weight: 500;
  }
  .entry {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-left: 4px solid var(--push);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .entry.result-win { border-left-color: var(--win); }
  .entry.result-lose { border-left-color: var(--lose); }
  .entry-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .entry-mult {
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--accent);
  }
  .entry-result {
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 0.8rem;
  }
  .entry-result.win { background: rgba(59,165,93,0.2); color: var(--win); }
  .entry-result.lose { background: rgba(224,82,82,0.2); color: var(--lose); }
  .entry-result.push { background: rgba(122,139,163,0.2); color: var(--push); }
  .entry-details {
    font-size: 0.85rem;
    color: var(--text-dim);
    line-height: 1.6;
  }
  .entry-details b { color: var(--text); }
  .entry-note {
    font-size: 0.82rem;
    color: var(--text-dim);
    margin-top: 6px;
    white-space: pre-wrap;
    border-top: 1px solid var(--card-border);
    padding-top: 6px;
  }
  .entry-time {
    font-size: 0.72rem;
    color: #566078;
    margin-top: 4px;
  }
  .entry-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .entry-actions button {
    flex: 1;
    padding: 7px;
    border-radius: 8px;
    border: 1px solid var(--card-border);
    background: #222b40;
    color: var(--text-dim);
    font-size: 0.82rem;
    cursor: pointer;
  }
  .entry-actions button.edit { color: var(--accent); }
  .entry-actions button.delete { color: var(--lose); }
  .entry-actions button.confirm-delete {
    background: var(--lose);
    border-color: var(--lose);
    color: #fff;
    font-weight: 700;
  }

  .empty-msg {
    text-align: center;
    color: var(--text-dim);
    padding: 30px 0;
    font-size: 0.9rem;
  }
  .toggle-form-btn {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #16202f;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 16px;
  }

  .picker-btn {
    width: 100%;
    text-align: left;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--card-border);
    background: #222b40;
    color: var(--text);
    font-size: 0.95rem;
    cursor: pointer;
  }
  .picker-btn.placeholder { color: var(--text-dim); }

  .picker-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    z-index: 1000;
  }
  .picker-overlay.show { opacity: 1; pointer-events: auto; }
  .picker-sheet {
    background: var(--card);
    width: 100%;
    max-width: 480px;
    border: 1px solid var(--card-border);
    border-bottom: none;
    border-radius: 16px 16px 0 0;
    transform: translateY(100%);
    transition: transform 0.25s;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .picker-overlay.show .picker-sheet { transform: translateY(0); }
  .picker-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid var(--card-border);
    font-size: 0.95rem;
    font-weight: 700;
  }
  .picker-header button {
    background: none;
    border: none;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    padding: 4px 6px;
    color: var(--accent);
  }
  .picker-header .picker-cancel-btn { color: var(--text-dim); }
  .picker-wheel-wrap {
    position: relative;
    height: 220px;
    overflow: hidden;
  }
  .picker-wheel {
    height: 100%;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    padding: 88px 0;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .picker-wheel::-webkit-scrollbar { display: none; }
  .picker-item {
    height: 44px;
    line-height: 44px;
    text-align: center;
    scroll-snap-align: center;
    color: var(--text-dim);
    font-size: 1rem;
    transition: color 0.15s, font-size 0.15s;
  }
  .picker-item.active {
    color: var(--accent);
    font-weight: 700;
    font-size: 1.1rem;
  }
  .picker-highlight {
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 44px;
    transform: translateY(-50%);
    border-top: 1px solid var(--card-border);
    border-bottom: 1px solid var(--card-border);
    pointer-events: none;
  }

  .filter-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 12px;
  }
  .filter-bar label {
    margin: 0;
    font-size: 0.8rem;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .filter-bar select {
    flex: 1;
  }

  .profit-banner {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 16px;
    text-align: center;
    font-size: 0.8rem;
    color: var(--text-dim);
  }
  .profit-banner .profit-num {
    display: block;
    font-size: 1.7rem;
    font-weight: 800;
    margin-top: 4px;
  }
</style>
</head>
<body>

<h1>♠ アルティメットポーカー記録 ♥</h1>
<div class="subtitle">このブラウザ内に保存されます（通信なし・完全オフライン）</div>

<div class="filter-bar">
  <label for="dealerFilterSelect">ディーラーで絞り込む</label>
  <select id="dealerFilterSelect"></select>
</div>

<div class="summary" id="summary"></div>

<div class="profit-banner" id="profitBanner"></div>

<button class="toggle-form-btn" id="toggleFormBtn">＋ 新しく記録する</button>

<form id="entryForm" style="display:none;">
  <input type="hidden" id="editingId" value="">

  <div class="field">
    <label>プレイ倍率</label>
    <div class="btn-group" id="multGroup">
      <button type="button" data-val="4">x4</button>
      <button type="button" data-val="2">x2</button>
      <button type="button" data-val="1">x1</button>
      <button type="button" data-val="0">x0</button>
    </div>
    <div class="field-error" id="multError">プレイ倍率を選択してください</div>
  </div>

  <div class="field">
    <label>勝敗</label>
    <div class="btn-group win-lose" id="resultGroup">
      <button type="button" data-val="win">勝ち</button>
      <button type="button" data-val="lose">負け</button>
      <button type="button" data-val="push">プッシュ</button>
    </div>
    <div class="field-error" id="resultError">勝敗を選択してください</div>
  </div>

  <div class="field">
    <label>クォリファイ</label>
    <div class="btn-group" id="qualifyGroup">
      <button type="button" data-val="yes">あり</button>
      <button type="button" data-val="no">なし</button>
    </div>
    <div class="field-error" id="qualifyError">クォリファイの有無を選択してください</div>
  </div>

  <div class="field">
    <label>完成した役</label>
    <button type="button" class="picker-btn placeholder" id="handPickerBtn">選択してください</button>
  </div>

  <div class="field">
    <label>ディーラー</label>
    <button type="button" class="picker-btn placeholder" id="dealerPickerBtn">選択してください</button>
  </div>

  <div class="field">
    <label>メモ（任意）</label>
    <textarea id="noteInput" placeholder="ベット額や状況など自由に"></textarea>
  </div>

  <button type="submit" class="submit-btn" id="submitBtn">記録する</button>
  <button type="button" class="cancel-btn" id="cancelBtn">キャンセル</button>
</form>

<div class="picker-overlay" id="pickerOverlay">
  <div class="picker-sheet">
    <div class="picker-header">
      <button type="button" class="picker-cancel-btn" id="pickerCancelBtn">キャンセル</button>
      <span id="pickerTitle"></span>
      <button type="button" id="pickerDoneBtn">決定</button>
    </div>
    <div class="picker-wheel-wrap">
      <div class="picker-highlight"></div>
      <div class="picker-wheel" id="pickerWheel"></div>
    </div>
  </div>
</div>

<div class="entry-list">
  <h2>記録一覧</h2>
  <div id="entries"></div>
</div>

<script>
const STORAGE_KEY = 'ultimate_poker_entries_v1';
const DEALER_STORAGE_KEY = 'ultimate_poker_dealers_v1';
const HAND_OPTIONS = ['ハイカード', 'ワンペア', 'ツーペア', 'スリーカード', 'ストレート', 'フラッシュ', 'フルハウス', 'フォーカード', 'ストレートフラッシュ', 'ロイヤルフラッシュ'];
const PICKER_ITEM_HEIGHT = 44;

// Ultimate Texas Hold'em unit sizes: ante = blind = 1, trips side bet = 0.2.
const ANTE_UNIT = 1;
const BLIND_UNIT = 1;
const TRIPS_UNIT = 0.2;

// "X to 1" payout multipliers. A hand missing from a table loses that bet.
const TRIPS_PAYOUTS = {
  'ロイヤルフラッシュ': 100,
  'ストレートフラッシュ': 50,
  'フォーカード': 25,
  'フルハウス': 8,
  'フラッシュ': 6,
  'ストレート': 4,
  'スリーカード': 3,
};
const BLIND_PAYOUTS = {
  'ロイヤルフラッシュ': 500,
  'ストレートフラッシュ': 50,
  'フォーカード': 10,
  'フルハウス': 3,
  'フラッシュ': 2,
  'ストレート': 1,
};

let state = { mult: null, result: null, qualify: null, hand: '', dealer: '' };
let entries = [];
let dealers = [];
let editingId = null;
let deleteConfirmId = null;
let currentDealerFilter = 'all';

const form = document.getElementById('entryForm');
const toggleFormBtn = document.getElementById('toggleFormBtn');
const cancelBtn = document.getElementById('cancelBtn');
const entriesDiv = document.getElementById('entries');
const summaryDiv = document.getElementById('summary');
const profitBanner = document.getElementById('profitBanner');
const dealerFilterSelect = document.getElementById('dealerFilterSelect');
const handPickerBtn = document.getElementById('handPickerBtn');
const dealerPickerBtn = document.getElementById('dealerPickerBtn');
const pickerOverlay = document.getElementById('pickerOverlay');
const pickerWheel = document.getElementById('pickerWheel');
const pickerTitle = document.getElementById('pickerTitle');
const pickerCancelBtn = document.getElementById('pickerCancelBtn');
const pickerDoneBtn = document.getElementById('pickerDoneBtn');

function setupBtnGroup(groupId, stateKey, errorId) {
  const group = document.getElementById(groupId);
  group.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      group.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state[stateKey] = btn.dataset.val;
      if (errorId) document.getElementById(errorId).classList.remove('show');
    });
  });
}
setupBtnGroup('multGroup', 'mult', 'multError');
setupBtnGroup('resultGroup', 'result', 'resultError');
setupBtnGroup('qualifyGroup', 'qualify', 'qualifyError');

function resetForm() {
  state = { mult: null, result: null, qualify: null, hand: '', dealer: '' };
  editingId = null;
  document.getElementById('editingId').value = '';
  setPickerBtnLabel(handPickerBtn, '');
  setPickerBtnLabel(dealerPickerBtn, '');
  document.getElementById('noteInput').value = '';
  document.querySelectorAll('.btn-group button').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.field-error').forEach(e => e.classList.remove('show'));
  document.getElementById('submitBtn').textContent = '記録する';
}

function setPickerBtnLabel(btn, value) {
  btn.textContent = value || '選択してください';
  btn.classList.toggle('placeholder', !value);
}

// --- Drum-style wheel picker (used for 完成した役 and ディーラー) ---
let pickerContext = null;

function openPicker(title, options, currentValue, onConfirm, opts = {}) {
  pickerContext = { options: [...options], allowAdd: !!opts.allowAdd, onConfirm };
  pickerTitle.textContent = title;
  renderPickerOptions(currentValue);
  pickerOverlay.classList.add('show');
}

function closePicker() {
  pickerOverlay.classList.remove('show');
  pickerContext = null;
}

function renderPickerOptions(selectedValue) {
  const list = pickerContext.options;
  let html = list.map((v, i) => `<div class="picker-item" data-idx="${i}">${escapeHtml(v)}</div>`).join('');
  if (pickerContext.allowAdd) {
    html += `<div class="picker-item" data-idx="add">＋ 新しく追加する</div>`;
  }
  pickerWheel.innerHTML = html;
  let idx = list.indexOf(selectedValue);
  if (idx === -1) idx = 0;
  pickerWheel.scrollTop = idx * PICKER_ITEM_HEIGHT;
  updateActivePickerItem();
}

function currentPickerIndex() {
  const items = pickerWheel.querySelectorAll('.picker-item');
  const idx = Math.round(pickerWheel.scrollTop / PICKER_ITEM_HEIGHT);
  return Math.min(Math.max(idx, 0), items.length - 1);
}

function updateActivePickerItem() {
  const items = pickerWheel.querySelectorAll('.picker-item');
  const idx = currentPickerIndex();
  items.forEach((el, i) => el.classList.toggle('active', i === idx));
}

let pickerScrollTimer = null;
pickerWheel.addEventListener('scroll', () => {
  updateActivePickerItem();
  clearTimeout(pickerScrollTimer);
  pickerScrollTimer = setTimeout(() => {
    pickerWheel.scrollTo({ top: currentPickerIndex() * PICKER_ITEM_HEIGHT, behavior: 'smooth' });
    updateActivePickerItem();
  }, 120);
});

pickerCancelBtn.addEventListener('click', closePicker);
pickerOverlay.addEventListener('click', (ev) => {
  if (ev.target === pickerOverlay) closePicker();
});

pickerDoneBtn.addEventListener('click', () => {
  if (!pickerContext) return;
  const items = pickerWheel.querySelectorAll('.picker-item');
  const idx = currentPickerIndex();
  const item = items[idx];
  if (!item) { closePicker(); return; }
  if (item.dataset.idx === 'add') {
    const name = window.prompt('新しいディーラー名を入力してください');
    if (name && name.trim()) {
      addDealer(name.trim());
      pickerContext.options = [...dealers];
      renderPickerOptions(name.trim());
    }
    return;
  }
  const value = pickerContext.options[Number(item.dataset.idx)];
  const onConfirm = pickerContext.onConfirm;
  closePicker();
  onConfirm(value);
});

handPickerBtn.addEventListener('click', () => {
  openPicker('完成した役', HAND_OPTIONS, state.hand, (val) => {
    state.hand = val;
    setPickerBtnLabel(handPickerBtn, val);
  });
});

dealerPickerBtn.addEventListener('click', () => {
  openPicker('ディーラー', dealers, state.dealer, (val) => {
    state.dealer = val;
    setPickerBtnLabel(dealerPickerBtn, val);
  }, { allowAdd: true });
});

function loadDealers() {
  try {
    const raw = localStorage.getItem(DEALER_STORAGE_KEY);
    dealers = raw ? JSON.parse(raw) : [];
  } catch (e) {
    dealers = [];
  }
}

function saveDealers() {
  localStorage.setItem(DEALER_STORAGE_KEY, JSON.stringify(dealers));
}

function addDealer(name) {
  if (!dealers.includes(name)) {
    dealers.push(name);
    saveDealers();
  }
}

toggleFormBtn.addEventListener('click', () => {
  resetForm();
  form.style.display = form.style.display === 'none' ? 'block' : 'none';
  toggleFormBtn.style.display = form.style.display === 'none' ? 'block' : 'none';
});

cancelBtn.addEventListener('click', () => {
  form.style.display = 'none';
  toggleFormBtn.style.display = 'block';
  resetForm();
});

// --- Storage: plain localStorage, synchronous, no network involved. ---
function loadEntries() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    entries = raw ? JSON.parse(raw) : [];
  } catch (e) {
    entries = [];
  }
  // Older records used "ペア" before it was renamed to "ワンペア".
  let migrated = false;
  entries.forEach(e => {
    if (e.hand === 'ペア') {
      e.hand = 'ワンペア';
      migrated = true;
    }
  });
  if (migrated) saveEntries();
}

function saveEntries() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
}

// Ante/Blind push on a tie, lose on a loss, and on a win: Ante pays 1:1 only if
// the dealer qualified, Blind pays via BLIND_PAYOUTS only for a straight or
// better (otherwise it just pushes). Play always follows the win/lose/push
// result at the recorded multiplier. Trips is independent of the hand result
// and pays via TRIPS_PAYOUTS based on the completed hand alone.
function computeProfit(e) {
  const mult = Number(e.mult) || 0;
  let ante = 0;
  let blind = 0;
  let play = 0;
  let trips = 0;

  if (e.result === 'lose') {
    ante = -ANTE_UNIT;
    blind = -BLIND_UNIT;
    play = -mult;
  } else if (e.result === 'win') {
    ante = e.qualify === 'yes' ? ANTE_UNIT : 0;
    play = mult;
    blind = BLIND_PAYOUTS[e.hand] ? BLIND_UNIT * BLIND_PAYOUTS[e.hand] : 0;
  }

  if (e.hand) {
    trips = TRIPS_PAYOUTS[e.hand] ? TRIPS_UNIT * TRIPS_PAYOUTS[e.hand] : -TRIPS_UNIT;
  }

  return ante + blind + play + trips;
}

function getFilteredEntries() {
  if (currentDealerFilter === 'all') return entries;
  if (currentDealerFilter === '__unset__') return entries.filter(e => !e.dealer);
  return entries.filter(e => e.dealer === currentDealerFilter);
}

function populateDealerFilterOptions() {
  const hasUnset = entries.some(e => !e.dealer);
  dealerFilterSelect.innerHTML = '';
  const allOpt = document.createElement('option');
  allOpt.value = 'all';
  allOpt.textContent = 'すべて';
  dealerFilterSelect.appendChild(allOpt);
  if (hasUnset) {
    const unsetOpt = document.createElement('option');
    unsetOpt.value = '__unset__';
    unsetOpt.textContent = '未設定';
    dealerFilterSelect.appendChild(unsetOpt);
  }
  dealers.forEach(d => {
    const opt = document.createElement('option');
    opt.value = d;
    opt.textContent = d;
    dealerFilterSelect.appendChild(opt);
  });
  const values = Array.from(dealerFilterSelect.options).map(o => o.value);
  if (!values.includes(currentDealerFilter)) currentDealerFilter = 'all';
  dealerFilterSelect.value = currentDealerFilter;
}

dealerFilterSelect.addEventListener('change', () => {
  currentDealerFilter = dealerFilterSelect.value;
  refreshView();
});

function refreshView() {
  populateDealerFilterOptions();
  const filtered = getFilteredEntries();
  renderEntries(filtered);
  renderSummary(filtered);
}

function renderSummary(list) {
  const total = list.length;
  const wins = list.filter(e => e.result === 'win').length;
  const losses = list.filter(e => e.result === 'lose').length;
  const rate = total > 0 ? Math.round((wins / total) * 100) : 0;
  summaryDiv.innerHTML = `
    <div><span class="num accent-color">${total}</span>回数</div>
    <div><span class="num win-color">${wins}</span>勝ち</div>
    <div><span class="num lose-color">${losses}</span>負け</div>
    <div><span class="num accent-color">${rate}%</span>勝率</div>
  `;

  const profit = list.reduce((sum, e) => sum + computeProfit(e), 0);
  const sign = profit > 0 ? '+' : '';
  const cls = profit > 0 ? 'win-color' : profit < 0 ? 'lose-color' : 'accent-color';
  profitBanner.innerHTML = `収支（ベット単位、Ante=Blind=1 / Trips=0.2）<span class="profit-num ${cls}">${sign}${profit.toFixed(1)}</span>`;
}

function resultLabel(r) {
  if (r === 'win') return '勝ち';
  if (r === 'lose') return '負け';
  return 'プッシュ';
}

function formatDate(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderEntries(list) {
  if (list.length === 0) {
    entriesDiv.innerHTML = '<div class="empty-msg">まだ記録がありません</div>';
    return;
  }
  const sorted = [...list].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  entriesDiv.innerHTML = sorted.map(e => {
    const confirming = deleteConfirmId === e.id;
    const profit = computeProfit(e);
    const profitSign = profit > 0 ? '+' : '';
    const profitClass = profit > 0 ? 'win-color' : profit < 0 ? 'lose-color' : '';
    return `
    <div class="entry result-${e.result}">
      <div class="entry-top">
        <span class="entry-mult">x${e.mult}</span>
        <span class="entry-result ${e.result}">${resultLabel(e.result)}</span>
      </div>
      <div class="entry-details">
        クォリファイ: <b>${e.qualify === 'yes' ? 'あり' : 'なし'}</b><br>
        役: <b>${e.hand ? escapeHtml(e.hand) : '—'}</b><br>
        ディーラー: <b>${e.dealer ? escapeHtml(e.dealer) : '—'}</b><br>
        収支: <b class="${profitClass}">${profitSign}${profit.toFixed(1)}</b>
      </div>
      ${e.note ? `<div class="entry-note">${escapeHtml(e.note)}</div>` : ''}
      <div class="entry-time">${formatDate(e.createdAt)}</div>
      <div class="entry-actions">
        ${confirming ? `
          <button class="confirm-delete" onclick="confirmDelete('${e.id}')">本当に削除する</button>
          <button onclick="cancelDelete()">やめる</button>
        ` : `
          <button class="edit" onclick="editEntry('${e.id}')">編集</button>
          <button class="delete" onclick="askDelete('${e.id}')">削除</button>
        `}
      </div>
    </div>
  `;
  }).join('');
}

window.editEntry = function(id) {
  const e = entries.find(en => en.id === id);
  if (!e) return;
  resetForm();
  editingId = id;
  document.getElementById('editingId').value = id;
  state.mult = e.mult;
  state.result = e.result;
  state.qualify = e.qualify;
  state.hand = e.hand || '';
  state.dealer = e.dealer || '';
  document.querySelector(`#multGroup button[data-val="${e.mult}"]`).classList.add('active');
  document.querySelector(`#resultGroup button[data-val="${e.result}"]`).classList.add('active');
  document.querySelector(`#qualifyGroup button[data-val="${e.qualify}"]`).classList.add('active');
  setPickerBtnLabel(handPickerBtn, state.hand);
  setPickerBtnLabel(dealerPickerBtn, state.dealer);
  document.getElementById('noteInput').value = e.note || '';
  document.getElementById('submitBtn').textContent = '更新する';
  form.style.display = 'block';
  toggleFormBtn.style.display = 'none';
  window.scrollTo({top: 0, behavior: 'smooth'});
};

window.askDelete = function(id) {
  deleteConfirmId = id;
  renderEntries(getFilteredEntries());
};

window.cancelDelete = function() {
  deleteConfirmId = null;
  renderEntries(getFilteredEntries());
};

window.confirmDelete = function(id) {
  entries = entries.filter(e => e.id !== id);
  deleteConfirmId = null;
  saveEntries();
  refreshView();
};

form.addEventListener('submit', (ev) => {
  ev.preventDefault();
  let valid = true;
  if (!state.mult) { document.getElementById('multError').classList.add('show'); valid = false; }
  if (!state.result) { document.getElementById('resultError').classList.add('show'); valid = false; }
  if (!state.qualify) { document.getElementById('qualifyError').classList.add('show'); valid = false; }
  if (!valid) return;

  const hand = state.hand;
  const dealer = state.dealer;
  const note = document.getElementById('noteInput').value;

  if (editingId) {
    const idx = entries.findIndex(e => e.id === editingId);
    if (idx !== -1) {
      entries[idx] = { ...entries[idx], mult: state.mult, result: state.result, qualify: state.qualify, hand, dealer, note };
    }
  } else {
    entries.push({
      id: 'e_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
      mult: state.mult,
      result: state.result,
      qualify: state.qualify,
      hand,
      dealer,
      note,
      createdAt: new Date().toISOString(),
    });
  }

  saveEntries();
  refreshView();
  resetForm();
  form.style.display = 'none';
  toggleFormBtn.style.display = 'block';
});

loadEntries();
loadDealers();
refreshView();
</script>

</body>
</html>
