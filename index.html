<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>アルティメットポーカー記録</title>
<style>
  :root {
    --bg: #0f1420;
    --card: #1a2233;
    --card-border: #2a3550;
    --accent: #d4af37;
    --accent-dim: #8a7226;
    --text: #eef1f7;
    --text-dim: #9aa5bb;
    --win: #3ba55d;
    --lose: #e05252;
    --push: #7a8ba3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
    padding-bottom: 60px;
  }
  h1 {
    font-size: 1.3rem;
    margin: 4px 0 4px;
    text-align: center;
    color: var(--accent);
    letter-spacing: 0.5px;
  }
  .subtitle {
    text-align: center;
    font-size: 0.72rem;
    color: var(--text-dim);
    margin-bottom: 16px;
  }
  .summary {
    display: flex;
    justify-content: space-around;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 16px;
    font-size: 0.85rem;
  }
  .summary div { text-align: center; }
  .summary .num { font-size: 1.2rem; font-weight: bold; display: block; }
  .win-color { color: var(--win); }
  .lose-color { color: var(--lose); }
  .accent-color { color: var(--accent); }

  form {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .field { margin-bottom: 14px; }
  label {
    display: block;
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .field-error {
    font-size: 0.75rem;
    color: var(--lose);
    margin-top: 6px;
    display: none;
  }
  .field-error.show { display: block; }
  .btn-group {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .btn-group button {
    flex: 1;
    min-width: 48px;
    padding: 10px 6px;
    border-radius: 8px;
    border: 1px solid var(--card-border);
    background: #222b40;
    color: var(--text);
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-group button.active {
    background: var(--accent);
    color: #16202f;
    border-color: var(--accent);
  }
  .btn-group.win-lose button[data-val="win"].active {
    background: var(--win); border-color: var(--win); color: #fff;
  }
  .btn-group.win-lose button[data-val="lose"].active {
    background: var(--lose); border-color: var(--lose); color: #fff;
  }
  .btn-group.win-lose button[data-val="push"].active {
    background: var(--push); border-color: var(--push); color: #fff;
  }
  select {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--card-border);
    background: #222b40;
    color: var(--text);
    font-size: 0.95rem;
  }
  textarea {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--card-border);
    background: #222b40;
    color: var(--text);
    font-size: 0.9rem;
    resize: vertical;
    min-height: 40px;
    font-family: inherit;
  }
  .submit-btn {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    color: #16202f;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 4px;
  }
  .cancel-btn {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--card-border);
    background: transparent;
    color: var(--text-dim);
    font-size: 0.9rem;
    margin-top: 8px;
    cursor: pointer;
  }

  .entry-list h2 {
    font-size: 1rem;
    color: var(--text-dim);
    margin: 0 0 10px 2px;
    font-weight: 500;
  }
  .entry {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-left: 4px solid var(--push);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .entry.result-win { border-left-color: var(--win); }
  .entry.result-lose { border-left-color: var(--lose); }
  .entry-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .entry-mult {
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--accent);
  }
  .entry-result {
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 0.8rem;
  }
  .entry-result.win { background: rgba(59,165,93,0.2); color: var(--win); }
  .entry-result.lose { background: rgba(224,82,82,0.2); color: var(--lose); }
  .entry-result.push { background: rgba(122,139,163,0.2); color: var(--push); }
  .entry-details {
    font-size: 0.85rem;
    color: var(--text-dim);
    line-height: 1.6;
  }
  .entry-details b { color: var(--text); }
  .entry-note {
    font-size: 0.82rem;
    color: var(--text-dim);
    margin-top: 6px;
    white-space: pre-wrap;
    border-top: 1px solid var(--card-border);
    padding-top: 6px;
  }
  .entry-time {
    font-size: 0.72rem;
    color: #566078;
    margin-top: 4px;
  }
  .entry-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .entry-actions button {
    flex: 1;
    padding: 7px;
    border-radius: 8px;
    border: 1px solid var(--card-border);
    background: #222b40;
    color: var(--text-dim);
    font-size: 0.82rem;
    cursor: pointer;
  }
  .entry-actions button.edit { color: var(--accent); }
  .entry-actions button.delete { color: var(--lose); }
  .entry-actions button.confirm-delete {
    background: var(--lose);
    border-color: var(--lose);
    color: #fff;
    font-weight: 700;
  }

  .empty-msg {
    text-align: center;
    color: var(--text-dim);
    padding: 30px 0;
    font-size: 0.9rem;
  }
  .toggle-form-btn {
    width: 100%;
    padding: 13px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #16202f;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 16px;
  }

  .picker-btn {
    width: 100%;
    text-align: left;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--card-border);
    background: #222b40;
    color: var(--text);
    font-size: 0.95rem;
    cursor: pointer;
  }
  .picker-btn.placeholder { color: var(--text-dim); }

  .picker-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    z-index: 1000;
  }
  .picker-overlay.show { opacity: 1; pointer-events: auto; }
  .picker-sheet {
    background: var(--card);
    width: 100%;
    max-width: 480px;
    border: 1px solid var(--card-border);
    border-bottom: none;
    border-radius: 16px 16px 0 0;
    transform: translateY(100%);
    transition: transform 0.25s;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .picker-overlay.show .picker-sheet { transform: translateY(0); }
  .picker-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid var(--card-border);
    font-size: 0.95rem;
    font-weight: 700;
  }
  .picker-header button {
    background: none;
    border: none;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    padding: 4px 6px;
    color: var(--accent);
  }
  .picker-header .picker-cancel-btn { color: var(--text-dim); }
  .picker-wheel-wrap {
    position: relative;
    height: 220px;
    overflow: hidden;
  }
  .picker-wheel {
    height: 100%;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    padding: 88px 0;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .picker-wheel::-webkit-scrollbar { display: none; }
  .picker-item {
    height: 44px;
    line-height: 44px;
    text-align: center;
    scroll-snap-align: center;
    color: var(--text-dim);
    font-size: 1rem;
    transition: color 0.15s, font-size 0.15s;
  }
  .picker-item.active {
    color: var(--accent);
    font-weight: 700;
    font-size: 1.1rem;
  }
  .picker-highlight {
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 44px;
    transform: translateY(-50%);
    border-top: 1px solid var(--card-border);
    border-bottom: 1px solid var(--card-border);
    pointer-events: none;
  }

  .filter-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 12px;
  }
  .filter-bar label {
    margin: 0;
    font-size: 0.8rem;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .filter-bar select {
    flex: 1;
  }

  .profit-banner {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 16px;
    text-align: center;
    font-size: 0.8rem;
    color: var(--text-dim);
  }
  .profit-banner .profit-num {
    display: block;
    font-size: 1.7rem;
    font-weight: 800;
    margin-top: 4px;
  }

  .update-banner {
    position: sticky;
    top: 0;
    z-index: 2000;
    margin: -16px -16px 16px;
    padding: 12px 16px;
    background: var(--accent);
    color: #16202f;
    font-size: 0.85rem;
    font-weight: 700;
    text-align: center;
    cursor: pointer;
  }

  .data-actions {
    display: flex;
    gap: 8px;
    margin-bottom: 6px;
  }
  .data-btn {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--card-border);
    background: var(--card);
    color: var(--text-dim);
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
  }
  .data-note {
    font-size: 0.7rem;
    color: var(--text-dim);
    margin-bottom: 16px;
    line-height: 1.5;
  }

  .view-tabs {
    margin-bottom: 16px;
  }

  .hand-range-title {
    text-align: center;
    color: var(--accent);
    font-size: 1rem;
    font-weight: 700;
    margin-bottom: 12px;
  }
  .hand-range-wrap {
    overflow-x: auto;
    border: 1px solid var(--card-border);
    border-radius: 12px;
    margin-bottom: 14px;
  }
  .hand-range-grid {
    border-collapse: collapse;
  }
  .hand-range-grid th,
  .hand-range-grid td {
    width: 46px;
    height: 46px;
    text-align: center;
    padding: 0;
  }
  .hand-range-grid th {
    position: sticky;
    top: 0;
    background: var(--card);
    color: var(--accent);
    font-size: 0.85rem;
    z-index: 1;
  }
  .hand-range-grid th.corner {
    left: 0;
    z-index: 2;
  }
  .hand-range-grid td.rank-label {
    position: sticky;
    left: 0;
    background: var(--card);
    color: var(--accent);
    font-size: 0.85rem;
    font-weight: 700;
  }
  .hand-range-cell {
    font-size: 0.62rem;
    line-height: 1.3;
    color: #fff;
    font-weight: 700;
  }
  .hand-range-cell.raise { background: var(--lose); }
  .hand-range-cell.check { background: var(--card-border); }
  .hand-range-cell.pair { box-shadow: inset 0 0 0 2px var(--accent); }
  .hand-range-cell .sub { display: block; font-weight: 500; opacity: 0.85; }

  .hand-range-legend {
    font-size: 0.75rem;
    color: var(--text-dim);
    line-height: 1.8;
  }
  .hand-range-legend-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .hand-range-swatch {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .hand-range-swatch span.box {
    display: inline-block;
    width: 16px;
    height: 16px;
    border-radius: 4px;
  }
  .hand-range-swatch .raise-box { background: var(--lose); }
  .hand-range-swatch .check-box { background: var(--card-border); }
  .hand-range-swatch .pair-box { background: transparent; box-shadow: inset 0 0 0 2px var(--accent); }
</style>
</head>
<body>

<h1>♠ アルティメットポーカー記録 ♥</h1>
<div class="subtitle">このブラウザ内に保存されます（通信なし・完全オフライン）</div>

<div class="btn-group view-tabs" id="viewTabs">
  <button type="button" data-view="records" class="active">記録</button>
  <button type="button" data-view="handrange">ハンドレンジ表</button>
</div>

<div id="recordsView">
<div class="data-actions">
  <button type="button" class="data-btn" id="exportBtn">バックアップを保存</button>
  <button type="button" class="data-btn" id="importBtn">バックアップから復元</button>
</div>
<div class="data-note">ホーム画面へのアイコンの追加をやり直すと記録が引き継がれないことがあります。定期的にバックアップの保存をおすすめします。</div>
<input type="file" id="importFileInput" accept="application/json,.json" style="display:none">

<div class="filter-bar">
  <label for="dealerFilterSelect">ディーラーで絞り込む</label>
  <select id="dealerFilterSelect"></select>
</div>

<div class="summary" id="summary"></div>

<div class="profit-banner" id="profitBanner"></div>

<button class="toggle-form-btn" id="toggleFormBtn">＋ 新しく記録する</button>

<form id="entryForm" style="display:none;">
  <input type="hidden" id="editingId" value="">

  <div class="field">
    <label>プレイ倍率</label>
    <div class="btn-group" id="multGroup">
      <button type="button" data-val="4">x4</button>
      <button type="button" data-val="3">x3</button>
      <button type="button" data-val="2">x2</button>
      <button type="button" data-val="1">x1</button>
      <button type="button" data-val="0">x0</button>
    </div>
    <div class="field-error" id="multError">プレイ倍率を選択してください</div>
  </div>

  <div class="field" id="resultField">
    <label>勝敗</label>
    <div class="btn-group win-lose" id="resultGroup">
      <button type="button" data-val="win">勝ち</button>
      <button type="button" data-val="lose">負け</button>
      <button type="button" data-val="push">プッシュ</button>
    </div>
    <div class="field-error" id="resultError">勝敗を選択してください</div>
  </div>

  <div class="field" id="qualifyField">
    <label>クォリファイ</label>
    <div class="btn-group" id="qualifyGroup">
      <button type="button" data-val="yes">あり</button>
      <button type="button" data-val="no">なし</button>
    </div>
    <div class="field-error" id="qualifyError">クォリファイの有無を選択してください</div>
  </div>

  <div class="field">
    <label>アンテ額（＝ブラインド額）</label>
    <button type="button" class="picker-btn" id="antePickerBtn">選択してください</button>
  </div>

  <div class="field">
    <label>トリップス額</label>
    <button type="button" class="picker-btn" id="tripsPickerBtn">選択してください</button>
  </div>

  <div class="field">
    <label>6カードボーナス額</label>
    <button type="button" class="picker-btn" id="sixCardBonusPickerBtn">選択してください</button>
  </div>

  <div class="field">
    <label>完成した役（ブラインド・トリップス判定用）</label>
    <button type="button" class="picker-btn" id="handPickerBtn">選択してください</button>
  </div>

  <div class="field" id="sixCardHandField">
    <label>6カードボーナスの役</label>
    <button type="button" class="picker-btn" id="sixCardHandPickerBtn">選択してください</button>
  </div>

  <div class="field">
    <label>ディーラー</label>
    <button type="button" class="picker-btn placeholder" id="dealerPickerBtn">選択してください</button>
  </div>

  <div class="field">
    <label>メモ（任意）</label>
    <textarea id="noteInput" placeholder="ベット額や状況など自由に"></textarea>
  </div>

  <button type="submit" class="submit-btn" id="submitBtn">記録する</button>
  <button type="button" class="cancel-btn" id="cancelBtn">キャンセル</button>
</form>

<div class="picker-overlay" id="pickerOverlay">
  <div class="picker-sheet">
    <div class="picker-header">
      <button type="button" class="picker-cancel-btn" id="pickerCancelBtn">キャンセル</button>
      <span id="pickerTitle"></span>
      <button type="button" id="pickerDoneBtn">決定</button>
    </div>
    <div class="picker-wheel-wrap">
      <div class="picker-highlight"></div>
      <div class="picker-wheel" id="pickerWheel"></div>
    </div>
  </div>
</div>

<div class="entry-list">
  <h2>記録一覧</h2>
  <div id="entries"></div>
</div>
</div>

<div id="handRangeView" style="display:none;"></div>

<script>
// Bump this on every deploy. Used to detect a stale cached copy — this
// matters most for "Add to Home Screen" launches, which tend to reopen a
// cached page instead of hitting the network like a normal browser tab.
const APP_VERSION = '2026-08-06.4';

const STORAGE_KEY = 'ultimate_poker_entries_v1';
const DEALER_STORAGE_KEY = 'ultimate_poker_dealers_v1';
const SESSION_DEFAULTS_KEY = 'ultimate_poker_session_defaults_v1';
const HAND_OPTIONS = ['配当なし', 'スリーカード', 'ストレート', 'フラッシュ', 'フルハウス', 'フォーカード', 'ストレートフラッシュ', 'ロイヤルフラッシュ'];
const SIX_CARD_HAND_OPTIONS = ['配当なし', 'スリーカード', '5枚ストレート', '5枚フラッシュ', 'フルハウス', 'フォーカード', '5枚ストレートフラッシュ', '5枚ロイヤルフラッシュ', '6枚ロイヤルフラッシュ'];
const PICKER_ITEM_HEIGHT = 44;

// Preflop hand-range chart (Ultimate Texas Hold'em). Rows/cols both ranked
// A,K,Q,...,2. '1' = raise 4x, '0' = check. Transcribed by sampling each
// cell's background pixel color from the reference chart image, then
// verified against its own caption ("every Ace hand raises" and "every pair
// 33+ raises, only 22 checks") — both checks passed exactly.
const HAND_RANGE_RANKS = ['A', 'K', 'Q', 'J', 'T', '9', '8', '7', '6', '5', '4', '3', '2'];
const HAND_RANGE_RAISE = [
  '1111111111111', // A
  '1111111111111', // K
  '1111111110000', // Q
  '1111111000000', // J
  '1111100000000', // T
  '1110010000000', // 9
  '1110001000000', // 8
  '1100000100000', // 7
  '1100000010000', // 6
  '1100000001000', // 5
  '1000000000100', // 4
  '1000000000010', // 3
  '1000000000000', // 2
];

function handRangeLabel(rowRank, colRank, rowIdx, colIdx) {
  if (rowIdx === colIdx) return rowRank + rowRank;
  if (colIdx > rowIdx) return rowRank + colRank + 's';
  return colRank + rowRank + 'o';
}

function renderHandRangeGrid() {
  const headerCells = HAND_RANGE_RANKS.map(r => `<th>${r}</th>`).join('');
  const bodyRows = HAND_RANGE_RANKS.map((rowRank, rowIdx) => {
    const cells = HAND_RANGE_RANKS.map((colRank, colIdx) => {
      const isRaise = HAND_RANGE_RAISE[rowIdx][colIdx] === '1';
      const isPair = rowIdx === colIdx;
      const label = handRangeLabel(rowRank, colRank, rowIdx, colIdx);
      const cls = ['hand-range-cell', isRaise ? 'raise' : 'check', isPair ? 'pair' : ''].join(' ').trim();
      return `<td class="${cls}">${label}<span class="sub">${isRaise ? '4x' : 'C'}</span></td>`;
    }).join('');
    return `<tr><td class="rank-label">${rowRank}</td>${cells}</tr>`;
  }).join('');

  handRangeView.innerHTML = `
    <div class="hand-range-title">ホールカード2枚で即判断</div>
    <div class="hand-range-wrap">
      <table class="hand-range-grid">
        <thead><tr><th class="corner"></th>${headerCells}</tr></thead>
        <tbody>${bodyRows}</tbody>
      </table>
    </div>
    <div class="hand-range-legend">
      <div class="hand-range-legend-row">
        <span class="hand-range-swatch"><span class="box raise-box"></span>4xレイズ</span>
        <span class="hand-range-swatch"><span class="box check-box"></span>チェック</span>
        <span class="hand-range-swatch"><span class="box pair-box"></span>ペア</span>
      </div>
      <div>上三角 = スーテッド(s) ／ 下三角 = オフスーテッド(o) ／ 対角線 = ポケットペア</div>
      <div>※ 22のみチェック、33以上のペアとエース系はすべて4x</div>
      <div>House Edge ≈ 2.2%（Ante + Blind, optimal play）</div>
    </div>

function numberRange(min, max, step) {

  for (let v = min; v <= max; v += step) arr.push(v);

}

// --- Drum-style wheel picker (used for 完成した役 and ディーラー) ---
let pickerContext = null;

function openPicker(title, options, currentValue, onConfirm, opts = {}) {
  pickerContext = { options: [...options], allowAdd: !!opts.allowAdd, onConfirm };
  pickerTitle.textContent = title;
  renderPickerOptions(currentValue);
  pickerOverlay.classList.add('show');
}

function closePicker() {
  pickerOverlay.classList.remove('show');
  pickerContext = null;
}

function renderPickerOptions(selectedValue) {
  const list = pickerContext.options;
  let html = list.map((v, i) => `<div class="picker-item" data-idx="${i}">${escapeHtml(v)}</div>`).join('');
  if (pickerContext.allowAdd) {
    html += `<div class="picker-item" data-idx="add">＋ 新しく追加する</div>`;
  }
  pickerWheel.innerHTML = html;
  let idx = list.indexOf(selectedValue);
  if (idx === -1) idx = 0;
  pickerWheel.scrollTop = idx * PICKER_ITEM_HEIGHT;
  updateActivePickerItem();
}

function currentPickerIndex() {
  const items = pickerWheel.querySelectorAll('.picker-item');
  const idx = Math.round(pickerWheel.scrollTop / PICKER_ITEM_HEIGHT);
  return Math.min(Math.max(idx, 0), items.length - 1);
}

function updateActivePickerItem() {
  const items = pickerWheel.querySelectorAll('.picker-item');
  const idx = currentPickerIndex();
  items.forEach((el, i) => el.classList.toggle('active', i === idx));
}

let pickerScrollTimer = null;
pickerWheel.addEventListener('scroll', () => {
  updateActivePickerItem();
  clearTimeout(pickerScrollTimer);
  pickerScrollTimer = setTimeout(() => {
    pickerWheel.scrollTo({ top: currentPickerIndex() * PICKER_ITEM_HEIGHT, behavior: 'smooth' });
    updateActivePickerItem();
  }, 120);
});

pickerCancelBtn.addEventListener('click', closePicker);
pickerOverlay.addEventListener('click', (ev) => {
  if (ev.target === pickerOverlay) closePicker();
});

pickerDoneBtn.addEventListener('click', () => {
  if (!pickerContext) return;
  const items = pickerWheel.querySelectorAll('.picker-item');
  const idx = currentPickerIndex();
  const item = items[idx];
  if (!item) { closePicker(); return; }
  if (item.dataset.idx === 'add') {
    const name = window.prompt('新しいディーラー名を入力してください');
    if (name && name.trim()) {
      addDealer(name.trim());
      pickerContext.options = [...dealers];
      renderPickerOptions(name.trim());
    }
    return;
  }
  const value = pickerContext.options[Number(item.dataset.idx)];
  const onConfirm = pickerContext.onConfirm;
  closePicker();
  onConfirm(value);
});

// Manual backup/restore, since localStorage isn't guaranteed to survive
// re-adding this page to a phone's home screen (iOS in particular can give a
// re-added icon a fresh, empty storage area separate from the old one).
function exportData() {
  const payload = { version: APP_VERSION, exportedAt: new Date().toISOString(), entries, dealers };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `ultimate_poker_backup_${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

// Merges by entry id rather than replacing, so restoring into a store that
// already has some entries (e.g. two devices used in parallel) doesn't lose
// anything on either side.
function importDataFromFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try {
      data = JSON.parse(reader.result);
    } catch (e) {
      window.alert('ファイルの読み込みに失敗しました。バックアップファイルか確認してください。');
      return;
    }
    const importedEntries = Array.isArray(data.entries) ? data.entries : [];
    const importedDealers = Array.isArray(data.dealers) ? data.dealers : [];
    const existingIds = new Set(entries.map(e => e.id));
    let addedCount = 0;
    importedEntries.forEach(e => {
      if (e && e.id && !existingIds.has(e.id)) {
        entries.push(e);
        existingIds.add(e.id);
        addedCount++;
      }
    });
    importedDealers.forEach(d => addDealer(d));
    saveEntries();
    refreshView();
    window.alert(`${addedCount}件の記録を復元しました（すでにある記録と重複するものはスキップしました）`);
  };
  reader.readAsText(file);
}

// --- Storage: plain localStorage, synchronous, no network involved. ---
function loadEntries() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    entries = raw ? JSON.parse(raw) : [];
  } catch (e) {
    entries = [];
  }
  // Older records used "ペア" before it was renamed to "ワンペア".
  let migrated = false;
  entries.forEach(e => {
    if (e.hand === 'ペア') {
      e.hand = 'ワンペア';
      migrated = true;
    }
  });
  if (migrated) saveEntries();
}

function saveEntries() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
}

// Play and Blind (same size as Ante) are decided purely by the win/lose/push
// hand comparison, regardless of dealer qualify: lose forfeits them, push
// returns them, and on a win Play pays 1:1 while Blind pays via
// BLIND_PAYOUTS only for a straight or better (otherwise it just pushes).
// Ante instead is decided purely by whether the dealer qualified: if not, it
// always pushes even if the hand comparison was a loss (the dealer's
// non-qualifying hand can still beat a weaker player hand and take Blind/
// Play while Ante is protected); if the dealer did qualify, Ante follows the
// same win/lose/push comparison as everything else. Trips and the 6 Card
// Bonus are each independent of the hand result and of each other: Trips
// pays via TRIPS_PAYOUTS based on the completed 5-card hand, and the 6 Card
// Bonus pays via SIX_CARD_BONUS_PAYOUTS based on the separately-recorded
// 6-card hand (a 6-card Royal Flush is a flat jackpot regardless of bet
// size). Both are skipped entirely when their bet is 0. Entries recorded
// before real bet amounts existed fall back to the old fixed unit sizes so
// their previously displayed profit doesn't change.
function computeProfit(e) {
  const mult = Number(e.mult) || 0;
  const anteBet = e.anteBet != null ? e.anteBet : ANTE_UNIT;
  const tripsBet = e.tripsBet != null ? e.tripsBet : TRIPS_UNIT;
  const sixCardBonusBet = e.sixCardBonusBet || 0;

  let ante = 0;
  let blind = 0;
  let play = 0;
  let trips = 0;
  let sixCard = 0;

  if (e.result === 'lose') {
    blind = -anteBet;
    play = -(anteBet * mult);
  } else if (e.result === 'win') {
    play = anteBet * mult;
    blind = BLIND_PAYOUTS[e.hand] ? anteBet * BLIND_PAYOUTS[e.hand] : 0;
  }

  if (e.qualify === 'no') {
    ante = 0;
  } else if (e.result === 'lose') {
    ante = -anteBet;
  } else if (e.result === 'win') {
    ante = anteBet;
  }

  if (tripsBet > 0) {
    trips = TRIPS_PAYOUTS[e.hand] ? tripsBet * TRIPS_PAYOUTS[e.hand] : -tripsBet;
  }

  if (sixCardBonusBet > 0) {
    if (e.sixCardHand === SIX_CARD_BONUS_JACKPOT_HAND) {
      sixCard = SIX_CARD_BONUS_JACKPOT_AMOUNT;
    } else if (SIX_CARD_BONUS_PAYOUTS[e.sixCardHand]) {
      sixCard = sixCardBonusBet * SIX_CARD_BONUS_PAYOUTS[e.sixCardHand];
    } else {
      sixCard = -sixCardBonusBet;
    }
  }

  return ante + blind + play + trips + sixCard;
}

function getFilteredEntries() {
  if (currentDealerFilter === 'all') return entries;
  if (currentDealerFilter === '__unset__') return entries.filter(e => !e.dealer);
  return entries.filter(e => e.dealer === currentDealerFilter);
}

function populateDealerFilterOptions() {
  const hasUnset = entries.some(e => !e.dealer);
  dealerFilterSelect.innerHTML = '';
  const allOpt = document.createElement('option');
  allOpt.value = 'all';
  allOpt.textContent = 'すべて';
  dealerFilterSelect.appendChild(allOpt);
  if (hasUnset) {
    const unsetOpt = document.createElement('option');
    unsetOpt.value = '__unset__';
    unsetOpt.textContent = '未設定';
    dealerFilterSelect.appendChild(unsetOpt);
  }
  dealers.forEach(d => {
    const opt = document.createElement('option');
    opt.value = d;
    opt.textContent = d;
    dealerFilterSelect.appendChild(opt);
  });
  const values = Array.from(dealerFilterSelect.options).map(o => o.value);
  if (!values.includes(currentDealerFilter)) currentDealerFilter = 'all';
  dealerFilterSelect.value = currentDealerFilter;
}

dealerFilterSelect.addEventListener('change', () => {
  currentDealerFilter = dealerFilterSelect.value;
  refreshView();
});

function refreshView() {
  populateDealerFilterOptions();
  const filtered = getFilteredEntries();
  renderEntries(filtered);
  renderSummary(filtered);
}

function renderSummary(list) {
  const total = list.length;
  const wins = list.filter(e => e.result === 'win').length;
  const losses = list.filter(e => e.result === 'lose').length;
  const rate = total > 0 ? Math.round((wins / total) * 100) : 0;
  summaryDiv.innerHTML = `
    <div><span class="num accent-color">${total}</span>回数</div>
    <div><span class="num win-color">${wins}</span>勝ち</div>
    <div><span class="num lose-color">${losses}</span>負け</div>
    <div><span class="num accent-color">${rate}%</span>勝率</div>
  `;

  const profit = list.reduce((sum, e) => sum + computeProfit(e), 0);
  const sign = profit > 0 ? '+' : '';
  const cls = profit > 0 ? 'win-color' : profit < 0 ? 'lose-color' : 'accent-color';
  profitBanner.innerHTML = `収支（アンテ・トリップス・6カードボーナスの実ベット額ベース）<span class="profit-num ${cls}">${sign}${formatProfit(profit)}</span>`;
}

// Rounds away binary floating-point noise (e.g. from legacy 0.2-unit trips
// bets) before formatting with thousands separators.
function formatProfit(n) {
  const rounded = Math.round(n * 100) / 100;
  return rounded.toLocaleString(undefined, { maximumFractionDigits: 2 });
}

function resultLabel(e) {
  if (String(e.mult) === '0') return 'フォールド';
  if (e.result === 'win') return '勝ち';
  if (e.result === 'lose') return '負け';
  return 'プッシュ';
}

function formatDate(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderEntries(list) {
  if (list.length === 0) {
    entriesDiv.innerHTML = '<div class="empty-msg">まだ記録がありません</div>';
    return;
  }
  const sorted = [...list].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  entriesDiv.innerHTML = sorted.map(e => {
    const confirming = deleteConfirmId === e.id;
    const profit = computeProfit(e);
    const profitSign = profit > 0 ? '+' : '';
    const profitClass = profit > 0 ? 'win-color' : profit < 0 ? 'lose-color' : '';
    const folded = String(e.mult) === '0';
    const badgeClass = folded ? 'lose' : e.result;
    const anteBet = e.anteBet != null ? e.anteBet : ANTE_UNIT;
    const tripsBet = e.tripsBet != null ? e.tripsBet : TRIPS_UNIT;
    const sixCardBonusBet = e.sixCardBonusBet || 0;
    return `
    <div class="entry result-${e.result}">
      <div class="entry-top">
        <span class="entry-mult">x${e.mult}</span>
        <span class="entry-result ${badgeClass}">${resultLabel(e)}</span>
      </div>
      <div class="entry-details">
        ${folded ? '' : `クォリファイ: <b>${e.qualify === 'yes' ? 'あり' : 'なし'}</b><br>`}
        アンテ額: <b>${formatProfit(anteBet)}</b><br>
        役: <b>${escapeHtml(e.hand || '配当なし')}</b><br>
        ${tripsBet > 0 ? `トリップス額: <b>${formatProfit(tripsBet)}</b><br>` : ''}
        ${sixCardBonusBet > 0 ? `6カードボーナス額: <b>${formatProfit(sixCardBonusBet)}</b><br>6カードボーナスの役: <b>${escapeHtml(e.sixCardHand || '配当なし')}</b><br>` : ''}
        ディーラー: <b>${e.dealer ? escapeHtml(e.dealer) : '—'}</b><br>
        収支: <b class="${profitClass}">${profitSign}${formatProfit(profit)}</b>
      </div>
      ${e.note ? `<div class="entry-note">${escapeHtml(e.note)}</div>` : ''}
      <div class="entry-time">${formatDate(e.createdAt)}</div>
      <div class="entry-actions">
        ${confirming ? `
          <button class="confirm-delete" onclick="confirmDelete('${e.id}')">本当に削除する</button>
          <button onclick="cancelDelete()">やめる</button>
        ` : `
          <button class="edit" onclick="editEntry('${e.id}')">編集</button>
          <button class="delete" onclick="askDelete('${e.id}')">削除</button>
        `}
      </div>
    </div>
  `;
  }).join('');
}

window.editEntry = function(id) {
  const e = entries.find(en => en.id === id);
  if (!e) return;
  resetForm();
  editingId = id;
  document.getElementById('editingId').value = id;
  state.mult = e.mult;
  state.result = e.result;
  state.qualify = e.qualify;
  state.hand = e.hand || '配当なし';
  state.dealer = e.dealer || '';
  state.anteBet = e.anteBet != null ? e.anteBet : ANTE_UNIT;
  state.tripsBet = e.tripsBet != null ? e.tripsBet : TRIPS_UNIT;
  state.sixCardBonusBet = e.sixCardBonusBet || 0;
  state.sixCardHand = e.sixCardHand || '配当なし';
  document.querySelector(`#multGroup button[data-val="${e.mult}"]`).classList.add('active');
  const resultBtn = document.querySelector(`#resultGroup button[data-val="${e.result}"]`);
  if (resultBtn) resultBtn.classList.add('active');
  const qualifyBtn = document.querySelector(`#qualifyGroup button[data-val="${e.qualify}"]`);
  if (qualifyBtn) qualifyBtn.classList.add('active');
  setPickerBtnLabel(handPickerBtn, state.hand);
  setPickerBtnLabel(dealerPickerBtn, state.dealer);
  setPickerBtnLabel(antePickerBtn, String(state.anteBet));
  setPickerBtnLabel(tripsPickerBtn, String(state.tripsBet));
  setPickerBtnLabel(sixCardBonusPickerBtn, String(state.sixCardBonusBet));
  setPickerBtnLabel(sixCardHandPickerBtn, state.sixCardHand);
  document.getElementById('noteInput').value = e.note || '';
  document.getElementById('submitBtn').textContent = '更新する';
  updateFoldVisibility();
  updateSixCardHandVisibility();
  form.style.display = 'block';
  toggleFormBtn.style.display = 'none';
  window.scrollTo({top: 0, behavior: 'smooth'});
};

window.askDelete = function(id) {
  deleteConfirmId = id;
  renderEntries(getFilteredEntries());
};

window.cancelDelete = function() {
  deleteConfirmId = null;
  renderEntries(getFilteredEntries());
};

window.confirmDelete = function(id) {
  entries = entries.filter(e => e.id !== id);
  deleteConfirmId = null;
  saveEntries();
  refreshView();
};

form.addEventListener('submit', (ev) => {
  ev.preventDefault();
  const folded = state.mult === '0';
  let valid = true;
  if (!state.mult) { document.getElementById('multError').classList.add('show'); valid = false; }
  if (!folded && !state.result) { document.getElementById('resultError').classList.add('show'); valid = false; }
  if (!folded && !state.qualify) { document.getElementById('qualifyError').classList.add('show'); valid = false; }
  if (!valid) return;

  const { hand, dealer, anteBet, tripsBet, sixCardBonusBet, sixCardHand } = state;
  const note = document.getElementById('noteInput').value;
  const fields = { mult: state.mult, result: state.result, qualify: state.qualify, hand, dealer, anteBet, tripsBet, sixCardBonusBet, sixCardHand, note };

  if (editingId) {
    const idx = entries.findIndex(e => e.id === editingId);
    if (idx !== -1) entries[idx] = { ...entries[idx], ...fields };
  } else {
    entries.push({
      id: 'e_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8),
      ...fields,
      createdAt: new Date().toISOString(),
    });
  }

  sessionDefaults = { dealer, anteBet, tripsBet, sixCardBonusBet };
  saveSessionDefaults();

  saveEntries();
  refreshView();
  resetForm();
  form.style.display = 'none';
  toggleFormBtn.style.display = 'block';
});

// "Add to Home Screen" launches tend to reopen a cached copy of this page
// rather than checking the network the way a normal browser tab would, so a
// deployed update can otherwise go unnoticed indefinitely. Re-fetch the page
// bypassing the cache whenever the app becomes visible again and prompt to
// reload if a newer APP_VERSION is found.
async function checkForUpdate() {
  try {
    const res = await fetch(location.pathname + '?_=' + Date.now(), { cache: 'no-store' });
    const text = await res.text();
    const match = text.match(/APP_VERSION\s*=\s*'([^']+)'/);
    if (match && match[1] !== APP_VERSION) showUpdateBanner();
  } catch (e) {
    // offline, or the fetch was blocked — nothing actionable to do
  }
}

function showUpdateBanner() {
  if (document.getElementById('updateBanner')) return;
  const banner = document.createElement('div');
  banner.id = 'updateBanner';
  banner.className = 'update-banner';
  banner.textContent = '新しいバージョンがあります。タップして更新';
  banner.addEventListener('click', () => location.reload());
  document.body.prepend(banner);
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') checkForUpdate();
});
window.addEventListener('pageshow', checkForUpdate);

loadEntries();
loadDealers();
loadSessionDefaults();
refreshView();
renderHandRangeGrid();
checkForUpdate();
</script>
